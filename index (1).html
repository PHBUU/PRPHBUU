<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบส่งข่าวประชาสัมพันธ์ | คณะสาธารณสุขศาสตร์</title>

  <!-- ============================================================
       จุดเดียวที่ต้องแก้: ใส่ URL เว็บแอป GAS ของคุณตรงนี้
       เวลา Deploy ใหม่แล้ว URL เปลี่ยน ให้กลับมาแก้แค่บรรทัดนี้
       ============================================================ -->
  <script>
    var GAS_URL = 'https://script.google.com/macros/s/AKfycbxAKNyWdfdKkZNCe2urfcXpsGfvnV1d2fOn4HceSQYSADn9cqo_rzU3HhkCO5B9YoJ33w/exec';

    // ส่งต่อ query string ทั้งหมด (?page=admin, ?page=status) ไปด้วย
    var target = GAS_URL + window.location.search;

    // replace แทน href เพื่อไม่ให้ปุ่ม Back ติดลูป
    window.location.replace(target);
  </script>

  <style>
    body {
      font-family: 'Kanit', 'Segoe UI', sans-serif;
      background: #0a0e17;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(34,211,238,0.2);
      border-top-color: #22d3ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 18px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
    p { font-size: 13px; color: #94a3b8; margin: 0 0 16px; }
    a {
      color: #67e8f9;
      font-size: 13px;
      text-decoration: none;
      border: 1px solid rgba(34,211,238,0.4);
      background: rgba(34,211,238,0.1);
      padding: 8px 16px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>📢 กำลังเข้าสู่ระบบส่งข่าวประชาสัมพันธ์</h1>
  <p>หากไม่เปลี่ยนหน้าอัตโนมัติภายใน 3 วินาที กรุณากดปุ่มด้านล่าง</p>
  <a id="manualLink" href="#">เข้าสู่ระบบ →</a>

  <script>
    document.getElementById('manualLink').href = target;
  </script>
</body>
</html>
